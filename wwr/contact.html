<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Us — Exciting Expeditions</title>

    <meta name="description"
      content="Contact Exciting Expeditions for rafting reservations, questions, and support.">
    <meta name="author" content="Promise Elohor">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <a class="brand" href="index.html">
            <img src="images/logo.svg" alt="Exciting Expeditions logo">
        </a>

        <nav aria-label="Primary">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO -->
        <section class="contact-info">
            <h1>Contact Us</h1>
            <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
            <p><strong>Phone:</strong> +1 999 999 9999</p>
            <p><strong>Email:</strong> info@whitewater.com</p>
        </section>

        <!-- MAP + FORM -->
        <section class="contact-grid">

            <!-- GOOGLE MAP -->
            <div class="map">
                <iframe src="https://www.google.com/maps?q=kolob+utah&output=embed" loading="lazy">
                </iframe>
            </div>

            <!-- FORM -->
            <form class="contact-form">

                <!-- NAME -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <!-- EMAIL -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <!-- PURPOSE -->
                <p>Message Purpose</p>

                <label for="general">
                    <input type="radio" id="general" name="purpose" value="general" checked>
                    General Inquiry
                </label>

                <label for="reservation">
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label for="suggestion">
                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <!-- MESSAGE -->
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <!-- CHECKBOX -->
                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <!-- SUBMIT -->
                <button type="submit">Send Message</button>

            </form>

        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Lead River Guide">
                    <figcaption>John – Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Tour Manager">
                    <figcaption>Sarah – Tour Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Safety Officer">
                    <figcaption>David – Safety Officer</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 | Exciting Expeditions | Promise Elohor</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn icon">
            </a>
        </nav>
    </footer>

</body>

</html>
